name: Build Smoothygram Camera2 diagnostic APK

on:
  workflow_dispatch:
  # One-off build trigger: Smoothygram v13 experimental preview and GL FPS diagnostics.
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-telegram.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Apply Camera2 diagnostic patches
        run: |
          git apply --check patches/telegram_camera2_fps_diagnostics.patch
          git apply patches/telegram_camera2_fps_diagnostics.patch
          git apply --check patches/telegram_camera2_stream_limits.patch
          git apply patches/telegram_camera2_stream_limits.patch

      - name: Configure own Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()
          if not re.fullmatch(r"[0-9]+", api_id) or not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
              sys.exit("Set TELEGRAM_API_ID and TELEGRAM_API_HASH in GitHub Actions repository secrets.")
          path = pathlib.Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          content = path.read_text()
          content, n1 = re.subn(r'public static int APP_ID = \d+;', f'public static int APP_ID = {api_id};', content, count=1)
          content, n2 = re.subn(r'public static String APP_HASH = "[^"]*";', f'public static String APP_HASH = "{api_hash}";', content, count=1)
          content, n3 = re.subn(r'public static boolean SUPPORTS_PASSKEYS = true;', 'public static boolean SUPPORTS_PASSKEYS = false;', content, count=1)
          if (n1, n2, n3) != (1, 1, 1):
              sys.exit("BuildVars.java layout changed; refusing to build with default app credentials.")
          path.write_text(content)
          print("Own Telegram API credentials configured (values not printed).")
          PY

      - name: Configure personal APK signing key
        env:
          TELEGRAM_SIGNING_KEYSTORE_BASE64: ${{ secrets.TELEGRAM_SIGNING_KEYSTORE_BASE64 }}
          TELEGRAM_SIGNING_PASSWORD: ${{ secrets.TELEGRAM_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re, sys
          encoded = os.environ.get("TELEGRAM_SIGNING_KEYSTORE_BASE64", "").strip()
          password = os.environ.get("TELEGRAM_SIGNING_PASSWORD", "")
          if not encoded or len(password) < 16:
              sys.exit("Missing signing secrets. Set TELEGRAM_SIGNING_KEYSTORE_BASE64 and TELEGRAM_SIGNING_PASSWORD.")
          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception:
              sys.exit("Invalid base64 signing key secret.")
          if not data or len(data) > 16384:
              sys.exit("Unexpected signing key size.")
          store_path = pathlib.Path("TMessagesProj/config/release.keystore")
          store_path.write_bytes(data)
          props = pathlib.Path("gradle.properties")
          content = props.read_text()
          for field, value in (
              ("RELEASE_KEY_PASSWORD", password),
              ("RELEASE_KEY_ALIAS", "weplick60"),
              ("RELEASE_STORE_PASSWORD", password),
          ):
              content, count = re.subn(r"(?m)^" + field + r"=.*$", lambda _: field + "=" + value, content, count=1)
              if count != 1:
                  sys.exit("Could not configure signing property " + field)
          props.write_text(content)
          print("Personal signing keystore configured; credentials kept out of repository and logs.")
          PY
          keytool -list -keystore TMessagesProj/config/release.keystore -storepass "$TELEGRAM_SIGNING_PASSWORD" -alias weplick60 > /dev/null

      - name: Configure Smoothygram Firebase app
        env:
          SMOOTHYGRAM_GOOGLE_SERVICES_BASE64: ${{ secrets.SMOOTHYGRAM_GOOGLE_SERVICES_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, sys
          encoded = os.environ.get("SMOOTHYGRAM_GOOGLE_SERVICES_BASE64", "").strip()
          if not encoded:
              sys.exit("Missing SMOOTHYGRAM_GOOGLE_SERVICES_BASE64. Register Android app com.weplick.smoothygram in Firebase, then save base64-encoded google-services.json in GitHub Actions secrets.")
          try:
              data = base64.b64decode(encoded, validate=True)
              config = json.loads(data)
          except Exception:
              sys.exit("Invalid base64 Firebase configuration JSON.")
          clients = [x for x in config.get("client", [])
                     if x.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.weplick.smoothygram"]
          if len(clients) != 1:
              sys.exit("Firebase config must contain exactly one client for com.weplick.smoothygram.")
          if not config.get("project_info", {}).get("project_number"):
              sys.exit("Missing Firebase project number.")
          if not clients[0].get("client_info", {}).get("mobilesdk_app_id"):
              sys.exit("Missing Firebase Android app ID.")
          if not clients[0].get("api_key"):
              sys.exit("Missing Firebase API key configuration.")
          pathlib.Path("TMessagesProj_App/google-services.json").write_bytes(data)
          print("Firebase configuration validated for Smoothygram; values omitted from logs.")
          PY

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Verify APK package, signature and SHA-256
        env:
          TELEGRAM_SIGNING_PASSWORD: ${{ secrets.TELEGRAM_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find TMessagesProj_App/build/outputs/apk -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one APK, found ${#apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$apksigner" verify --verbose --print-certs "$apk" > apk-verification.txt
          cat apk-verification.txt
          package_name=$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)
          echo "APK package: $package_name"
          test "$package_name" = "com.weplick.smoothygram"
          expected_digest=$(keytool -exportcert -keystore TMessagesProj/config/release.keystore -alias weplick60 -storepass "$TELEGRAM_SIGNING_PASSWORD" | sha256sum | awk '{print $1}')
          actual_digest=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-verification.txt | head -n1)
          if [ "$expected_digest" != "$actual_digest" ]; then
            echo "APK certificate does not match our signing key!"
            exit 1
          fi
          echo "Verified: personal signing certificate matches APK."
          sha256sum "$apk" | tee apk-sha256.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-camera2-diagnostic-apk
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            apk-sha256.txt
            apk-verification.txt
          if-no-files-found: error
